name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.claude/**'
      - '**.md'
      - 'docs/**'
      - 'examples/**'
      - 'assets/**'
      - 'LICENSE'
      - '.gitignore'
      - 'CHANGELOG.md'
      - 'README.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '.claude/**'
      - '**.md'
      - 'docs/**'
      - 'examples/**'
      - 'assets/**'
      - 'LICENSE'
      - '.gitignore'
      - 'CHANGELOG.md'
      - 'README.md'

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.26']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
        continue-on-error: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        shell: bash
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.txt
          flags: unittests
          name: codecov-umbrella
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # Pin a release built with Go 1.26 so it can load this go1.26
          # module. 'latest' still ships a go1.24-built binary as of
          # 2026-07, which fails with "Go language version (go1.24) used
          # to build golangci-lint is lower than the targeted Go version
          # (1.26)". v7 of the action is required to install v2.x of
          # golangci-lint.
          version: v2.12.2

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        run: go build -v ./...
